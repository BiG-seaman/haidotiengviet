<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hải đồ VN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2233;color:#eaf2f7;font:15px/1.35 system-ui,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#a9cbe0}
body.night canvas#map{filter:brightness(.45) sepia(.5) hue-rotate(-30deg)}
#top{position:absolute;top:0;left:0;right:0;background:rgba(8,28,44,.88);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;z-index:5}
#top .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#top .l{font-size:11px;color:#8fb3c9;margin-right:4px}
#top .pos{font-size:13px;font-variant-numeric:tabular-nums;color:#cfe3ef;margin-left:auto;display:flex;align-items:center;gap:8px;align-self:center}
#top .pos .ll{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;font-size:14px}
#top .pos .l{margin:0;text-align:right;line-height:1.2}
#navrow{width:100%;display:none;border-top:1px solid #24465c;padding-top:4px;gap:4px 14px;flex-wrap:wrap;align-items:baseline}
#navrow .v{color:#ffd54a}
#btns{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;gap:10px;z-index:5}
.fab{width:52px;height:52px;border-radius:50%;border:0;background:rgba(8,28,44,.9);color:#fff;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.fab.on{background:#0a84d6}
#modebar,#banner{position:absolute;left:10px;right:74px;bottom:28px;background:rgba(8,28,44,.93);border-radius:12px;padding:10px;display:none;z-index:6}
#banner{background:#c62828;bottom:auto;top:110px;right:10px;font-weight:700;font-size:18px;z-index:9}
#popup{position:absolute;display:none;background:#fff;color:#0b2233;border-radius:12px;padding:8px;min-width:210px;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:7}
#popup .t{font-weight:700;padding:4px 6px}
#popup .s{font-size:12px;color:#456;padding:0 6px 6px}
#popup button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 8px;font-size:15px;color:#0b2233;border-top:1px solid #e3eaef}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:#0f2a3d;border-radius:16px 16px 0 0;display:none;flex-direction:column;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.5)}
#panel header{display:flex;align-items:center;padding:12px 14px;font-size:17px;font-weight:700;border-bottom:1px solid #24465c}
#panel header span{flex:1}
#panel .body{overflow-y:auto;padding:8px 14px 24px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1d3d52}
.row .g{flex:1;min-width:0}
.row .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g small{color:#8fb3c9}
button.b{border:0;border-radius:9px;background:#1c5a80;color:#fff;padding:10px 12px;font-size:14px}
button.b.p{background:#0a84d6}button.b.r{background:#b33a3a}button.b.x{background:none;font-size:20px;padding:4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px}
.grid button{padding:16px 8px;font-size:15px}
input[type=text],input[type=number],select{width:100%;padding:11px;border-radius:9px;border:1px solid #2c5874;background:#0b2233;color:#fff;font-size:16px;margin:4px 0 10px}
label.sw{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #1d3d52}
label.sw input{width:22px;height:22px}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
#modal .box{background:#0f2a3d;border-radius:14px;padding:16px;width:86%;max-width:360px}
#modal .acts{display:flex;gap:10px;justify-content:flex-end}
#lock{position:absolute;inset:0;background:#0b1f2e;z-index:25;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px}
#lock .card{max-width:440px;width:100%;background:#12324a;border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#lock h2{margin:0 0 8px;font-size:20px}#lock .id{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:1px;background:#0a1a27;border-radius:10px;padding:10px;text-align:center;margin:6px 0}
#lock input{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border-radius:10px;border:1px solid #2f5672;background:#0a1a27;color:#fff;text-transform:uppercase}
#lock .msg{min-height:20px;color:#ffd54a;margin:8px 0}
#dlbox{position:absolute;left:10px;right:74px;top:120px;background:rgba(8,28,44,.95);border-radius:12px;padding:10px 12px;display:none;gap:10px;align-items:center;z-index:8;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:rgba(0,0,0,.85);padding:9px 16px;border-radius:20px;display:none;z-index:30;max-width:86%;text-align:center}
table.w{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.w td,table.w th{padding:6px 4px;border-bottom:1px solid #1d3d52;text-align:right}
table.w th{color:#8fb3c9;font-weight:500}
table.w td:first-child,table.w th:first-child{text-align:left}
.note{font-size:12px;color:#8fb3c9;padding:8px 0}
.cf{display:grid;grid-template-columns:1fr 1fr 1.25fr 68px;gap:6px}
.cf input,.cf select{margin:2px 0 8px;padding:11px 6px}
.cl{font-size:13px;color:#8fb3c9;margin-top:4px}
#panel h3{margin:16px 0 6px;font-size:15px}
#banner.ack{background:#e07b00}
#banner button{font-size:14px}
.info p{margin:8px 0}
#notice{position:absolute;left:10px;right:74px;bottom:96px;background:#fff3c4;color:#3b2a00;border-left:5px solid #f5b400;border-radius:10px;padding:10px 34px 10px 12px;font-size:15px;line-height:1.35;display:none;z-index:7;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;animation:ntIn .35s ease-out}
#notice .x{position:absolute;right:4px;top:2px;border:0;background:none;font-size:20px;color:#7a5a00;padding:4px 8px;cursor:pointer}
@keyframes ntIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#tidebox{position:absolute;left:10px;bottom:52px;background:rgba(8,28,44,.9);color:#eaf2f7;padding:7px 11px;border-radius:18px;font-size:14px;display:none;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.35);max-width:calc(100% - 90px)}
@media (min-width:900px){   /* màn hình máy tính: bảng nổi bên trái thay vì trải hết chiều ngang */
  #panel{left:12px;right:auto;bottom:12px;width:440px;max-height:calc(100% - 130px);border-radius:16px}
  #modebar{right:auto;width:440px}
  #popup button:hover,.row:hover{background:rgba(127,160,190,.12)}
  button.b:hover{filter:brightness(1.15)} .fab:hover{filter:brightness(1.3)}
  canvas#map{cursor:grab} canvas#map:active{cursor:grabbing}
}
#attr{position:absolute;left:6px;bottom:4px;font-size:10px;color:#123;background:rgba(255,255,255,.6);padding:1px 5px;border-radius:4px;z-index:2}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="top">
  <div><span class="l">TỐC ĐỘ</span><span class="v" id="sog">--</span> <span class="l">kn</span></div>
  <div><span class="l">HƯỚNG</span><span class="v" id="cog">--</span><span class="l">°</span></div>
  <div id="bhdg" style="display:none"><span class="l">MŨI</span><span class="v" id="hdg">--</span><span class="l">°</span></div>
  <div id="brot" style="display:none"><span class="l">ROT</span><span class="v" id="rot">--</span><span class="l">°/ph</span></div>
  <div id="bdep" style="display:none"><span class="l">SÂU</span><span class="v" id="dep">--</span><span class="l">m</span></div>
  <div class="pos"><span class="l" id="srctag"></span><span class="ll" id="pos">Chưa có GPS</span></div>
  <div id="navrow">
    <div><span class="l" id="navname">ĐẾN</span></div>
    <div><span class="l">P.VỊ</span><span class="v" id="nbrg">--</span><span class="l">°</span></div>
    <div><span class="l">K.CÁCH</span><span class="v" id="ndst">--</span> <span class="l">nm</span></div>
    <div><span class="l">LỆCH</span><span class="v" id="nxte">--</span></div>
    <div><span class="l">CÒN</span><span class="v" id="nttg">--</span></div>
    <div><span class="l">ĐẾN LÚC</span><span class="v" id="neta">--</span></div>
    <button class="b r" style="margin-left:auto;padding:6px 10px" onclick="stopNav()">Dừng</button>
  </div>
</div>
<div id="attr">© OpenStreetMap · OpenSeaMap</div>
<div id="tidebox" onclick="openAutoTide()"></div>
<div id="notice" onclick="noticeTap(event)"><span id="ntext"></span><button class="x" onclick="hideNotice(event)">✕</button></div>
<div id="btns">
  <button class="fab" id="bfollow" onclick="toggleFollow()">◎</button>
  <button class="fab" onclick="zoomBy(1)">＋</button>
  <button class="fab" onclick="zoomBy(-1)">－</button>
  <button class="fab" onclick="showLayers()">▤</button>
  <button class="fab" onclick="showMenu()">☰</button>
</div>
<div id="modebar"></div>
<div id="banner"></div>
<div id="popup"></div>
<div id="panel"></div>
<div id="modal"></div>
<div id="lock"><div class="card"><h2>🔑 Hải đồ VN</h2><p id="lockmsg">Đang kiểm tra bản quyền…</p></div></div>
<div id="dlbox"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= Cầu nối với phần Android ================= */
const NA = window.Android || null;
const PC = !!window.HD_PC;          // bản Windows
const store = {
  load(k){ try{ const s = NA ? NA.load(k) : localStorage.getItem('hd_'+k); return s ? JSON.parse(s) : null; }catch(e){ return null; } },
  save(k,v){ const s = JSON.stringify(v); try{ if(NA) NA.save(k,s); else localStorage.setItem('hd_'+k,s); }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ================= Dữ liệu ================= */
let wpts   = store.load('wpts')   || [];
let routes = store.load('routes') || [];
let tracks = store.load('tracks') || [];
let set = Object.assign({osm:true, sea:true, charts:{}, night:false, fmt:'dms', ais:{host:'192.168.1.1',port:10110,proto:'tcp'},
                         alm:{xte:true,xteNm:0.2,cpa:true,cpaNm:2,tcpaMin:15}, posSrc:'auto', aisLabel:'name', planKn:6,
                         own:{mmsi:'',vecMin:10,rings:0,ringNm:0.5}, aiso:{lostMin:3,delMin:10,rangeOn:false,rangeNm:20,ignAnch:true,anchKn:0.2,vecMin:10},
                         view:{lat:16.0,lon:108.6,zoom:6}}, store.load('settings')||{});
const APP_VER='1.18';
let charts = [];           // tệp MBTiles đã nạp
const saveSet = () => store.save('settings', set);

/* ================= Toán hàng hải ================= */
const R_NM = 3440.065, D2R = Math.PI/180;
function distNm(a,b){ const p1=a.lat*D2R,p2=b.lat*D2R,dl=(b.lon-a.lon)*D2R,dp=p2-p1;
  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*R_NM*Math.asin(Math.min(1,Math.sqrt(h))); }
function bearing(a,b){ const p1=a.lat*D2R,p2=b.lat*D2R,dl=(b.lon-a.lon)*D2R;
  const y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)/D2R+360)%360; }
function fmtDM(v,pos,neg){ const h=v>=0?pos:neg; v=Math.abs(v); const d=Math.floor(v); let m=(v-d)*60;
  if(m>=59.9995){ m=0; return (d+1)+'°00.000\''+h; } return d+'°'+(m<10?'0':'')+m.toFixed(3)+'\''+h; }
function dmsParts(v){ v=Math.abs(v); let d=Math.floor(v); const mf=(v-d)*60; let m=Math.floor(mf), s=Math.round((mf-m)*600)/10;
  if(s>=60){ s=0; m++; } if(m>=60){ m=0; d++; } return [d,m,s]; }
function fmtDMS(v,pos,neg){ const [d,m,s]=dmsParts(v); return d+'°'+String(m).padStart(2,'0')+'\''+(s<10?'0':'')+s.toFixed(1)+'"'+(v>=0?pos:neg); }
const fmtPos2 = p => '<span>'+(set.fmt==='dm'?fmtDM(p.lat,'N','S'):fmtDMS(p.lat,'N','S'))+'</span><span>'+(set.fmt==='dm'?fmtDM(p.lon,'E','W'):fmtDMS(p.lon,'E','W'))+'</span>';
const fmtPos = p => set.fmt==='dm' ? fmtDM(p.lat,'N','S')+'  '+fmtDM(p.lon,'E','W') : fmtDMS(p.lat,'N','S')+'  '+fmtDMS(p.lon,'E','W');
// cross-track: dương = tàu lệch sang phải đường A→B
function xteNm(a,b,p){ const d13=distNm(a,p)/R_NM, t13=bearing(a,p)*D2R, t12=bearing(a,b)*D2R; return Math.asin(Math.sin(d13)*Math.sin(t13-t12))*R_NM; }
const fmtNm = d => d<0.1 ? Math.round(d*1852)+' m' : (d<10?d.toFixed(2):d.toFixed(1))+' nm';
const fmt3 = d => String(Math.round(d)%360).padStart(3,'0');
function fmtDur(h){ if(!isFinite(h)) return '--'; const m=Math.round(h*60); return m<60 ? m+'ph' : Math.floor(m/60)+'g'+String(m%60).padStart(2,'0'); }
function fmtDurL(h){ if(!isFinite(h)||h<0) return '--'; const m=Math.round(h*60), d=Math.floor(m/1440), g=Math.floor(m%1440/60), p=m%60;
  return (d?d+' ngày ':'')+(d||g?g+' giờ ':'')+p+' phút'; }
function fmtClock(h){ if(!isFinite(h)||h<0) return '--'; const t=new Date(Date.now()+h*3600000), n=new Date(), pad=x=>String(x).padStart(2,'0');
  const hm=pad(t.getHours())+':'+pad(t.getMinutes()); return t.toDateString()===n.toDateString()?hm:hm+' '+pad(t.getDate())+'/'+pad(t.getMonth()+1); }
function pathNm(pts){ let d=0; for(let i=1;i<pts.length;i++) d+=distNm(pts[i-1],pts[i]); return d; }

/* ================= Phép chiếu Mercator ================= */
const lon2x = lon => (lon+180)/360;
const lat2y = lat => { const s=Math.sin(Math.max(-85.05,Math.min(85.05,lat))*D2R); return 0.5-Math.log((1+s)/(1-s))/(4*Math.PI); };
const x2lon = x => x*360-180;
const y2lat = y => 360/Math.PI*Math.atan(Math.exp((0.5-y)*2*Math.PI))-90;

/* ================= Bản đồ ================= */
const cv = $('map'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
const S = { cx:lon2x(set.view.lon), cy:lat2y(set.view.lat), zoom:set.view.zoom };
const scale = () => 256*Math.pow(2,S.zoom);
const ll2s = (lat,lon) => { const k=scale(); return [(lon2x(lon)-S.cx)*k+W/2, (lat2y(lat)-S.cy)*k+H/2]; };
const s2ll = (x,y) => { const k=scale(); return {lat:y2lat(S.cy+(y-H/2)/k), lon:x2lon(S.cx+(x-W/2)/k)}; };
let dirty=true; const redraw = () => { if(!dirty){ dirty=true; requestAnimationFrame(draw); } };
function resize(){ DPR=window.devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); dirty=false; redraw(); }
window.addEventListener('resize', resize);

/* --- Bộ nạp ô bản đồ: dùng theo sức máy, ưu tiên ô đang nhìn, tải trước ô xung quanh và các mức thu nhỏ --- */
const HW={cores:navigator.hardwareConcurrency||4, mem:navigator.deviceMemory||4};
function perf(){ const m=set.perf||'max', f=m==='max'?0.75:(m==='bal'?0.5:0.25);
  return { mode:m, maxc:Math.max(6,Math.min(32,Math.round(HW.cores*f*3))),          // số ô tải cùng lúc
           maxt:Math.max(400,Math.min(2400,Math.round(HW.mem*f*250))),             // số ô giữ sẵn trong bộ nhớ (~0,25 MB/ô)
           out:m==='max'?4:(m==='bal'?2:0), ring:m==='max'?2:(m==='bal'?1:0), zin:m!=='eco' }; }
let P=perf();
const tiles=new Map(); let want=new Map(), pref=new Map(), inflight=0;
const useBmp=typeof createImageBitmap==='function'&&!!NA;   // giải mã ảnh ngoài luồng chính, giữ sẵn dạng bitmap
function getTile(L,z,x,y,pri){
  const key=L.id+'/'+z+'/'+x+'/'+y; const t=tiles.get(key);
  if(t){ tiles.delete(key); tiles.set(key,t);                       // đánh dấu vừa dùng
    if(t.ok) return t.img; if(t.loading) return null; if(t.fail&&Date.now()-t.fail<30000) return null; }
  const w=want.get(key); if(!w||pri<w.pri) want.set(key,{L,z,x,y,pri,vis:true});
  return null; }
function peekTile(L,z,x,y){ const t=tiles.get(L.id+'/'+z+'/'+x+'/'+y); return t&&t.ok ? t.img : null; }
function queuePre(L,z,x,y,pri){ const key=L.id+'/'+z+'/'+x+'/'+y; const t=tiles.get(key);
  if(t&&(t.ok||t.loading||(t.fail&&Date.now()-t.fail<30000))) return; const w=pref.get(key); if(!w||pri<w.pri) pref.set(key,{L,z,x,y,pri}); }
function pumpTiles(){
  for(const map of [want,pref]){ if(inflight>=P.maxc) return; if(!map.size) continue;
    const list=[...map.entries()].sort((a,b)=>a[1].pri-b[1].pri);
    for(const [key,w] of list){ if(inflight>=P.maxc) return; const t=tiles.get(key); if(t&&(t.ok||t.loading)){ map.delete(key); continue; } startTile(key,w,map); } } }
function startTile(key,w,map){ const t={img:null,ok:false,fail:0,loading:true}; tiles.set(key,t); map.delete(key); inflight++;
  const done=img=>{ t.loading=false; inflight--; if(img){ t.img=img; t.ok=true; if(w.vis) redraw(); } else t.fail=Date.now(); pumpTiles(); };
  const url=w.L.url(w.z,w.x,w.y);
  if(useBmp) fetch(url).then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(b=>createImageBitmap(b)).then(done,()=>done(null));
  else { const img=new Image(); img.decoding='async'; img.onload=()=>done(img); img.onerror=()=>done(null); img.src=url; }
  if(tiles.size>P.maxt){ for(const [k,v] of tiles){ if(tiles.size<=P.maxt) break; if(v.loading) continue; if(v.img&&v.img.close) v.img.close(); tiles.delete(k); } } }
// tải trước khi bản đồ đứng yên: vòng ô quanh màn hình, các mức thu nhỏ (để zoom ra không trễ), mức phóng to kế tiếp ở giữa
let lastView='', preT=0;
function viewChanged(){ const v=S.cx.toFixed(6)+','+S.cy.toFixed(6)+','+S.zoom.toFixed(2); if(v===lastView) return; lastView=v; pref.clear(); clearTimeout(preT); preT=setTimeout(prefetch,200); }
function prefetch(){ if(!P.out&&!P.ring) return;
  const layers=activeLayers(); const z0=Math.round(S.zoom);
  layers.forEach((L,li)=>{ if(!L.id.startsWith('m_')) return;            // chỉ tải trước hải đồ MBTiles trong máy, không tải hàng loạt từ máy chủ bản đồ trực tuyến
    const plan=[[0,P.ring,1000]]; for(let d=1;d<=P.out;d++) plan.push([-d,1,2000+d*1000]); if(P.zin) plan.push([1,0,6000]);
    for(const [dz,margin,base] of plan){ const tz=pickZ(L,z0+dz); if(tz<0) continue;
      const n=1<<tz, sc=dz<0?256:Math.pow(2,S.zoom-tz)*256, x0=S.cx*n-W/2/sc, y0=S.cy*n-H/2/sc;   // mức thu nhỏ: phủ cả khung nhìn khi đã thu nhỏ tới mức đó
      let tx0=Math.floor(x0)-margin, tx1=Math.floor(x0+W/sc)+margin, ty0=Math.max(0,Math.floor(y0)-margin), ty1=Math.min(n-1,Math.floor(y0+H/sc)+margin);
      if(dz>0){ const cx=Math.floor(x0+W/2/sc), cy=Math.floor(y0+H/2/sc); tx0=cx-1; tx1=cx+1; ty0=Math.max(0,cy-1); ty1=Math.min(n-1,cy+1); }
      const ext=L.zooms&&L.zooms[tz]; let bx0=-1e9,bx1=1e9,by0=-1e9,by1=1e9;
      if(ext){ bx0=ext[0]; bx1=ext[1]; by0=ext[2]; by1=ext[3]; }
      else if(L.bounds){ bx0=Math.floor(lon2x(L.bounds[0])*n); bx1=Math.floor(lon2x(L.bounds[2])*n); by0=Math.floor(lat2y(L.bounds[3])*n); by1=Math.floor(lat2y(L.bounds[1])*n); }
      const cxT=x0+W/2/sc, cyT=y0+H/2/sc;
      for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){ const wx=((tx%n)+n)%n; if(wx<bx0||wx>bx1||ty<by0||ty>by1) continue;
        queuePre(L,tz,wx,ty,base+Math.hypot(tx+0.5-cxT,ty+0.5-cyT)+li*0.3); } } });
  pumpTiles(); }
function setPerf(m){ set.perf=m; saveSet(); P=perf(); lastView=''; redraw(); showLayers(); }

/* Thứ tự lớp MBTiles: tệp ít chi tiết (zoom thấp) nằm dưới, tệp chi tiết nằm trên; người dùng có thể đổi */
function orderedCharts(){ const ord=set.chartOrder||[];
  const k=c=>{ const i=ord.indexOf(c.id); return i>=0?i:1000+c.maxzoom*30+c.minzoom; };
  return charts.slice().sort((a,b)=>k(a)-k(b)); }
function moveChart(id,d){ const ids=orderedCharts().map(c=>c.id); const i=ids.indexOf(id), j=i+d; if(i<0||j<0||j>=ids.length) return;
  [ids[i],ids[j]]=[ids[j],ids[i]]; set.chartOrder=ids; saveSet(); redraw(); showLayers(); }
function autoOrder(){ delete set.chartOrder; saveSet(); redraw(); showLayers(); }

// chia ô ra 4 địa chỉ nội bộ để vượt giới hạn 6 kết nối/địa chỉ của trình duyệt
const shard=(x,y)=>PC?window.HD_SHARDS[(x+y)&3]:(NA?`https://m${(x+y)&3}.haido.local`:'');
function activeLayers(){
  const a=[];
  if(set.osm) a.push({id:'osm',min:0,max:19,url:(z,x,y)=> NA ? `/t/osm/${z}/${x}/${y}` : `https://tile.openstreetmap.org/${z}/${x}/${y}.png`});
  for(const c of orderedCharts()) if(set.charts[c.id]!==false && c.format!=='pbf')      // hải đồ MBTiles nằm dưới lớp phao tiêu
    a.push({id:'m_'+c.id,min:c.minzoom,max:c.maxzoom,bounds:c.bounds,zooms:c.zooms,over:true,url:(z,x,y)=>`${shard(x,y)}/m/${encodeURIComponent(c.id)}/${z}/${x}/${y}`});
  if(set.sea) a.push({id:'sea',min:9,max:18,nofallback:true,url:(z,x,y)=> NA ? `/t/sea/${z}/${x}/${y}` : `https://tiles.openseamap.org/seamark/${z}/${x}/${y}.png`});
  return a;
}
// chọn mức ô sẽ dùng cho lớp ở mức zoom hiện tại (cho phép phóng to quá mức tệp 4 bậc, thu nhỏ 1 bậc)
function pickZ(L,tz){
  if(L.zooms){ const zs=Object.keys(L.zooms).map(Number).sort((a,b)=>a-b); if(!zs.length) return -1;
    if(L.zooms[tz]) return tz;
    let lo=-1; for(const z of zs) if(z<=tz) lo=z; if(lo>=0&&tz-lo<=4) return lo;
    for(const z of zs) if(z>tz) return z-tz<=1?z:-1; return -1; }
  if(tz>L.max){ if(tz>L.max+(L.over?4:2)) return -1; return L.max; }
  if(tz<L.min) return (L.over&&tz>=L.min-1)?L.min:-1;
  return tz; }
function drawLayer(L,li){
  const tz=pickZ(L,Math.round(S.zoom)); if(tz<0) return;
  const n=1<<tz, sc=Math.pow(2,S.zoom-tz)*256;      // px màn hình cho mỗi ô
  const x0=S.cx*n-W/2/sc, y0=S.cy*n-H/2/sc;         // toạ độ ô ở góc trái trên
  const tx0=Math.floor(x0), tx1=Math.floor(x0+W/sc), ty0=Math.max(0,Math.floor(y0)), ty1=Math.min(n-1,Math.floor(y0+H/sc));
  let bx0=-1e9,bx1=1e9,by0=-1e9,by1=1e9;
  const ext=L.zooms&&L.zooms[tz];
  if(ext){ bx0=ext[0]; bx1=ext[1]; by0=ext[2]; by1=ext[3]; }
  else if(L.bounds){ bx0=Math.floor(lon2x(L.bounds[0])*n); bx1=Math.floor(lon2x(L.bounds[2])*n); by0=Math.floor(lat2y(L.bounds[3])*n); by1=Math.floor(lat2y(L.bounds[1])*n); }
  const cxT=x0+W/2/sc, cyT=y0+H/2/sc;
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    const wx=((tx%n)+n)%n;
    if(wx<bx0||wx>bx1||ty<by0||ty>by1) continue;
    const px=Math.round((tx-x0)*sc), py=Math.round((ty-y0)*sc), pw=Math.round((tx+1-x0)*sc)-px, ph=Math.round((ty+1-y0)*sc)-py;
    const img=getTile(L,tz,wx,ty,Math.hypot(tx+0.5-cxT,ty+0.5-cyT)+li*0.3);
    if(img){ ctx.drawImage(img,px,py,pw,ph); continue; }
    if(L.nofallback) continue;
    let done=false;
    for(let d=1;d<=6&&tz-d>=0;d++){                 // tạm vẽ ô mức thấp hơn (đã có sẵn) trong khi chờ
      const p=peekTile(L,tz-d,wx>>d,ty>>d); if(!p) continue;
      const f=1<<d, sw=p.width/f, sh=p.height/f;
      ctx.drawImage(p,(wx%f)*sw,(ty%f)*sh,sw,sh,px,py,pw,ph); done=true; break; }
    if(!done){                                       // khi thu nhỏ: dùng 4 ô con đã có
      for(let k=0;k<4;k++){ const c=peekTile(L,tz+1,wx*2+(k&1),ty*2+(k>>1)); if(!c) continue;
        const hw=pw/2, hh=ph/2; ctx.drawImage(c,px+(k&1)*hw,py+(k>>1)*hh,hw,hh); } }
  }
}

/* ================= Trạng thái hàng hải ================= */
let fix=null;            // {lat,lon,sog,cog,acc,t}
let follow=true;
let mode=null, modePts=[]; // 'measure' | 'route'
let nav=null;            // {name, pts:[...], idx}
let anchor=store.load('anchor');
const alm={}; let soundOn=false;   // báo động đang có: key -> {msg, ack}
let rec=store.load('rec');   // vết đang ghi {pts:[[lat,lon,t]]}
const ais=new Map(); let aisStatus='Chưa kết nối';

/* ================= Vẽ ================= */
function line(pts,color,w,dash){ if(pts.length<2) return; ctx.beginPath();
  pts.forEach((p,i)=>{ const [x,y]=ll2s(p.lat,p.lon); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.setLineDash(dash||[]); ctx.lineJoin='round'; ctx.stroke(); ctx.setLineDash([]); }
function label(t,x,y,col){ ctx.font='600 13px system-ui,sans-serif'; ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.strokeText(t,x,y); ctx.fillStyle=col||'#102a3c'; ctx.fillText(t,x,y); }
function dot(x,y,r,fill,stroke){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); } }
function draw(){
  dirty=false;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle=charts.some(c=>set.charts[c.id]!==false&&c.format!=='pbf')?'#f1ecdc':'#a9cbe0'; ctx.fillRect(0,0,W,H);
  want.clear(); activeLayers().forEach((L,i)=>drawLayer(L,i));
  // vết đã lưu + vết đang ghi
  for(const t of tracks) if(t.show!==false) line(t.pts.map(p=>({lat:p[0],lon:p[1]})),'#8e24aa',2.5);
  if(rec) line(rec.pts.map(p=>({lat:p[0],lon:p[1]})),'#e53935',3);
  // tuyến
  for(const r of routes) if(r.show!==false){ line(r.pts,'#ef6c00',3,[8,6]);
    r.pts.forEach((p,i)=>{ const [x,y]=ll2s(p.lat,p.lon); dot(x,y,5,'#fff','#ef6c00'); if(i===0) label(r.name,x+8,y-8,'#8a3d00'); }); }
  // dẫn đường
  if(nav){ const rest=nav.pts.slice(nav.idx); const st=nav.from||fix; line(st?[st,...rest]:rest,'#d50000',3.5);
    const t=nav.pts[nav.idx], [x,y]=ll2s(t.lat,t.lon); if(fix&&nav.from) line([fix,t],'rgba(213,0,0,.7)',1.5,[4,4]);
    dot(x,y,9,'rgba(213,0,0,.25)','#d50000'); }
  // điểm đánh dấu
  for(const w of wpts){ const [x,y]=ll2s(w.lat,w.lon); if(x<-50||y<-50||x>W+50||y>H+50) continue;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-8,y-20); ctx.arc(x,y-22,8,Math.PI,0); ctx.lineTo(x,y); ctx.fillStyle='#d81b60'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    if(S.zoom>=8) label(w.name,x+11,y-18); }
  // đo / tạo tuyến
  if(mode){ const col=mode==='measure'?'#00695c':'#ef6c00'; line(modePts,col,3,[6,5]);
    modePts.forEach((p,i)=>{ const [x,y]=ll2s(p.lat,p.lon); dot(x,y,6,'#fff',col);
      if(i>0) label(fmtNm(distNm(modePts[i-1],p))+' · '+fmt3(bearing(modePts[i-1],p))+'°',x+9,y+4,col); }); }
  // AIS
  const now=Date.now();
  const AO=set.aiso; for(const [id,a] of ais){ if(now-a.t>(a.aton?1800000:Math.max(1,AO.delMin)*60000)){ ais.delete(id); continue; } if(a.lat==null) continue;
    const [x,y]=ll2s(a.lat,a.lon); if(x<-30||y<-30||x>W+30||y>H+30) continue;
    if(a.aton){ ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+7,y); ctx.lineTo(x,y+9); ctx.lineTo(x-7,y); ctx.closePath();
      ctx.fillStyle=a.virt?'rgba(255,255,255,.6)':'rgba(194,24,91,.85)'; ctx.fill(); ctx.strokeStyle='#880e4f'; ctx.lineWidth=1.5; ctx.stroke();
      if(S.zoom>=12) label(aisLbl(id,a),x+10,y+4,'#880e4f'); continue; }
    const hd=(a.hdg!=null&&a.hdg<360)?a.hdg:((a.cog!=null&&a.cog<360)?a.cog:0);
    if(a.sog>0.5&&a.cog!=null&&S.zoom>=10&&AO.vecMin>0){ const mpp=40075016.686*Math.cos(a.lat*D2R)/scale(), len=Math.min(a.sog*1852*AO.vecMin/60/mpp,600);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.sin(a.cog*D2R)*len,y-Math.cos(a.cog*D2R)*len); ctx.strokeStyle=a.risk?'#d50000':'#2e7d32'; ctx.lineWidth=1.3; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]); }
    ctx.save(); ctx.translate(x,y); ctx.rotate(hd*D2R); ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(7,9); ctx.lineTo(-7,9); ctx.closePath();
    ctx.fillStyle=now-a.t>Math.max(0.5,AO.lostMin)*60000?'rgba(120,120,120,.7)':(a.risk?'rgba(213,0,0,.9)':(a.stype===30||a.nav===7?'rgba(255,160,0,.9)':'rgba(46,160,67,.85)')); ctx.fill(); ctx.strokeStyle='#103'; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
    if(a.risk){ ctx.beginPath(); ctx.arc(x,y,18,0,7); ctx.strokeStyle='#d50000'; ctx.lineWidth=2.5; ctx.stroke(); }
    if(S.zoom>=11||a.risk) label(aisLbl(id,a),x+12,y+4,a.risk?'#b71c1c':'#1b5e20'); }
  // neo
  if(anchor){ const [x,y]=ll2s(anchor.lat,anchor.lon); const mpp=40075016.686*Math.cos(anchor.lat*D2R)/scale();
    ctx.beginPath(); ctx.arc(x,y,anchor.r/mpp,0,7); ctx.fillStyle=alm.anchor?'rgba(213,0,0,.18)':'rgba(10,132,214,.14)'; ctx.fill();
    ctx.strokeStyle=alm.anchor?'#d50000':'#0a84d6'; ctx.lineWidth=2; ctx.stroke(); label('⚓',x-7,y+5,'#0a3d62'); }
  // tàu mình
  if(fix){ const [x,y]=ll2s(fix.lat,fix.lon), mpp=40075016.686*Math.cos(fix.lat*D2R)/scale();
    const moving=fix.sog>0.5&&fix.cog!=null, head=fix.hdg!=null?fix.hdg:(moving?fix.cog:null), stale=!fresh(fix.t,6000);
    if(fix.hdg!=null){ const L=Math.max(70,Math.min(W,H)/3); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.sin(fix.hdg*D2R)*L,y-Math.cos(fix.hdg*D2R)*L); ctx.strokeStyle='rgba(13,71,161,.6)'; ctx.lineWidth=1.2; ctx.stroke(); }
    if(set.own.rings>0){ for(let i=1;i<=set.own.rings;i++){ const r=set.own.ringNm*i*1852/mpp; if(r<4) continue; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.strokeStyle='rgba(198,40,40,.7)'; ctx.lineWidth=1.2; ctx.setLineDash([6,5]); ctx.stroke(); ctx.setLineDash([]); label((set.own.ringNm*i)+' nm',x+3,y-r-3,'#b71c1c'); } }
    if(moving&&set.own.vecMin>0){ const len=Math.min(fix.sog*1852*set.own.vecMin/60/mpp,Math.max(W,H)*2); // vectơ dự đoán theo hướng đi
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.sin(fix.cog*D2R)*len,y-Math.cos(fix.cog*D2R)*len); ctx.strokeStyle='#0d47a1'; ctx.lineWidth=2; ctx.stroke();
      if(fix.rot!=null&&Math.abs(fix.rot)>=1){ let la=fix.lat, lo=fix.lon, h=head; const pts=[{lat:la,lon:lo}]; // đường cong dự báo theo ROT
        for(let i=0;i<20;i++){ h+=Math.max(-60,Math.min(60,fix.rot))*0.5; const d=fix.sog*0.5/60; la+=d*Math.cos(h*D2R)/60; lo+=d*Math.sin(h*D2R)/60/Math.cos(la*D2R); pts.push({lat:la,lon:lo}); }
        line(pts,'#6a1b9a',2.2,[3,4]); } }
    if(head!=null){ ctx.save(); ctx.translate(x,y); ctx.rotate(head*D2R); ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(10,12); ctx.lineTo(0,6); ctx.lineTo(-10,12); ctx.closePath();
      ctx.fillStyle=stale?'#78909c':'#1565c0'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }
    else dot(x,y,9,stale?'#78909c':'#1565c0','#fff'); }
  drawScale(); pumpTiles(); viewChanged();
  set.view={lat:y2lat(S.cy),lon:x2lon(S.cx),zoom:S.zoom};
}
function drawScale(){ const lat=y2lat(S.cy), nmpp=40075016.686*Math.cos(lat*D2R)/scale()/1852;
  const steps=[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000]; let v=steps[0];
  for(const s of steps){ if(s/nmpp<=120) v=s; }
  const w=v/nmpp, x=10, y=H-26; ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fillRect(x-4,y-16,w+8,22);
  ctx.strokeStyle='#102a3c'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y-5); ctx.stroke();
  ctx.fillStyle='#102a3c'; ctx.font='12px system-ui,sans-serif'; ctx.fillText(v<0.1?Math.round(v*1852)+' m':v+' nm',x+4,y-4); }

/* ================= Thao tác chạm ================= */
const ptrs=new Map(); let g=null, lpTimer=null, lastTap=0;
function zoomAt(px,py,z){ z=Math.max(2,Math.min(20,z)); const k0=scale(); const wx=S.cx+(px-W/2)/k0, wy=S.cy+(py-H/2)/k0;
  S.zoom=z; const k=scale(); S.cx=wx-(px-W/2)/k; S.cy=Math.max(0,Math.min(1,wy-(py-H/2)/k)); redraw(); }
let zAnim=0;
function animZoom(px,py,target){ target=Math.max(2,Math.min(20,target)); const z0=S.zoom, t0=performance.now(), D=220; cancelAnimationFrame(zAnim);
  const step=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); zoomAt(px,py,z0+(target-z0)*e); if(k<1) zAnim=requestAnimationFrame(step); else saveSetSoon(); };
  zAnim=requestAnimationFrame(step); }
function zoomBy(d){ animZoom(W/2,H/2,Math.round(S.zoom)+d); }
let ssT=null; const saveSetSoon=()=>{ clearTimeout(ssT); ssT=setTimeout(saveSet,1500); };
cv.addEventListener('pointerdown',e=>{ cancelAnimationFrame(zAnim); cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ g={x0:e.clientX,y0:e.clientY,t0:Date.now(),moved:false,pinch:false};
    clearTimeout(lpTimer); lpTimer=setTimeout(()=>{ if(g&&!g.moved&&!g.pinch){ g.long=true; longPress(g.x0,g.y0); } },600);
  } else if(ptrs.size===2){ clearTimeout(lpTimer); const [a,b]=[...ptrs.values()]; g.pinch=true; g.d0=Math.hypot(a.x-b.x,a.y-b.y)||1; g.z0=S.zoom; } });
cv.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p||!g) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1&&!g.long){ if(!g.moved&&Math.hypot(e.clientX-g.x0,e.clientY-g.y0)<10) return;
    if(!g.moved){ g.moved=true; clearTimeout(lpTimer); hidePopup(); if(follow){ follow=false; updFollow(); } }
    const k=scale(); S.cx-=dx/k; S.cy=Math.max(0,Math.min(1,S.cy-dy/k)); redraw();
  } else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    zoomAt((a.x+b.x)/2,(a.y+b.y)/2,g.z0+Math.log2(d/g.d0)); } });
function pup(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); clearTimeout(lpTimer);
  if(ptrs.size===0&&g){ if(!g.moved&&!g.pinch&&!g.long&&Date.now()-g.t0<450){ const now=Date.now();
      if(now-lastTap<300&&!mode){ animZoom(e.clientX,e.clientY,Math.round(S.zoom)+1); lastTap=0; } else { lastTap=now; tap(e.clientX,e.clientY); } }
    g=null; saveSetSoon(); } }
cv.addEventListener('pointerup',pup); cv.addEventListener('pointercancel',pup);
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,S.zoom-e.deltaY/400); },{passive:false});

function hit(x,y){ let best=null,bd=28;
  for(const w of wpts){ const [sx,sy]=ll2s(w.lat,w.lon); const d=Math.hypot(sx-x,sy-12-y); if(d<bd){ bd=d; best={type:'w',o:w}; } }
  for(const [id,a] of ais){ if(a.lat==null) continue; const [sx,sy]=ll2s(a.lat,a.lon); const d=Math.hypot(sx-x,sy-y); if(d<bd){ bd=d; best={type:'a',o:a,id}; } }
  return best; }
function tap(x,y){ const p=s2ll(x,y);
  if(mode){ modePts.push(p); updMode(); redraw(); return; }
  if($('popup').style.display==='block'){ hidePopup(); return; }
  const h=hit(x,y); if(!h) return;
  if(h.type==='w') wptPopup(h.o,x,y);
  else { const a=h.o, id=h.id; let s=(a.aton?'Phao AIS':esc(shipType(a.stype)||'Tàu AIS'))+' · MMSI '+id+'<br>Tốc độ '+(a.sog!=null?a.sog.toFixed(1)+' kn':'--')+' · Hướng '+(a.cog!=null&&a.cog<360?fmt3(a.cog)+'°':'--');
    if(fix) s+='<br>Cách tàu '+fmtNm(distNm(fix,a))+' · P.vị '+fmt3(bearing(fix,a))+'°';
    const c=a.aton?null:cpaOf(a); if(c) s+='<br>'+(a.risk?'<b style="color:#c62828">⚠ ':'')+'CPA '+fmtNm(c.cpa)+' · TCPA '+(c.tcpa>=0?Math.round(c.tcpa)+' phút':'đang xa dần')+(a.risk?'</b>':'');
    showPopup(x,y,esc(aisLbl(id,a)),s,[['ℹ Xem đầy đủ thông số',()=>aisDetail(id)]]); } }
function longPress(x,y){ if(mode) return; const p=s2ll(x,y); let s=fmtPos(p);
  if(fix) s+='<br>Cách tàu '+fmtNm(distNm(fix,p))+' · P.vị '+fmt3(bearing(fix,p))+'°';
  showPopup(x,y,'Vị trí đã chọn',s,[
    ['📍 Đánh dấu điểm',()=>addWpt(p)],
    ['🧭 Đi tới đây',()=>startNav('Điểm chọn',[p])],
    ['📏 Đo từ đây',()=>{ startMode('measure'); modePts.push(p); updMode(); }],
    ['🌬 Dự báo gió, sóng tại đây',()=>showPointWeather(p)],
    ['🌊 Thủy triều tại đây',()=>showTide(p)] ]); }
let popActs=[];
function showPopup(x,y,title,sub,acts){ const el=$('popup'); popActs=acts;

let autoSrc='phone';
function curSrc(){ if(set.posSrc==='phone') return 'phone'; if(set.posSrc==='ship') return 'ship';

/* Bộ lọc vị trí: loại điểm nhảy bất thường, làm mượt vị trí/tốc độ/hướng đi để vị trí và hướng tàu ổn định. */
const gpsF={phone:{rej:0},ship:{rej:0}};
function circMix(a,b,k){ if(a==null) return b; if(b==null) return a; let d=((b-a+540)%360)-180; return (a+d*k+360)%360; }
function smoothFix(src,m,prev){ const st=gpsF[src];
  if(!prev||m.t-prev.t>15000){ st.rej=0; m.good=1; return m; }
  const dt=Math.max(0.2,(m.t-prev.t)/1000), dm=distNm(prev,m)*1852;
  const vmax=(Math.max(m.sog||0,prev.sog||0)*1.6+12)*0.514444;               // m/giây cho phép
  const slack=(m.acc>0?m.acc:6)+(prev.acc>0?prev.acc:6);
  if(dm>vmax*dt+slack*1.5&&++st.rej<4) return null;                            // điểm nhảy: bỏ (tối đa 3 lần liên tiếp)
  st.rej=0;
  // dự đoán theo tốc độ/hướng đi trước đó rồi trộn với số đo; số đo càng chính xác càng tin số đo
  let k=m.acc>0?Math.min(0.9,Math.max(0.35,1-m.acc/60)):0.85;
  const still=(m.sog||0)<0.4&&(prev.sog||0)<0.4;
  if(still&&dm<slack) k=Math.min(k,0.25);                                     // tàu đứng yên: không để vị trí "bò" lung tung

  let cog=prev.cog; if(m.cog!=null&&m.sog>0.4) cog=Math.abs(((m.cog-(prev.cog==null?m.cog:prev.cog)+540)%360)-180)>40?m.cog:circMix(prev.cog,m.cog,0.5);
  return {lat:plat+(m.lat-plat)*k, lon:plon+(m.lon-plon)*k, sog, cog, acc:m.acc, t:m.t, good:Math.min(99,(prev.good||0)+1)}; }
let phoneSats=null;

window.onGps=function(lat,lon,spd,brg,acc,t){

  const r=smoothFix('phone',m,phoneFix); if(!r) return; if(r.cog==null&&phoneFix) r.cog=phoneFix.cog; phoneFix=r;
  if(curSrc()==='phone') applyFix(); };
function applyFix(){ const src=curSrc(), f=src==='ship'?shipFix:phoneFix;
  if(!f){ fix=null; updTop(); redraw(); return; }
  fix={lat:f.lat,lon:f.lon,sog:f.sog,cog:f.cog,acc:f.acc,t:f.t,src,
       hdg:fresh(ship.hdgT,10000)?ship.hdg:null, rot:fresh(ship.rotT,10000)?ship.rot:null};
  updTop();
  if(follow&&!g){ S.cx=lon2x(fix.lon); S.cy=lat2y(fix.lat); }
  if(rec){ const l=rec.pts[rec.pts.length-1]; if(!l||distNm({lat:l[0],lon:l[1]},fix)*1852>12){ rec.pts.push([+fix.lat.toFixed(6),+fix.lon.toFixed(6),fix.t]); if(rec.pts.length%15===0) store.save('rec',rec); } }

function updTop(){ const show=(id,on)=>{ $(id).style.display=on?'':'none'; };
  if(!fix){ $('sog').textContent='--'; $('cog').textContent='--'; $('pos').textContent=curSrc()==='ship'?'Chưa có GPS tàu':'Chưa có GPS'; $('srctag').textContent=''; }
  else { $('sog').textContent=fix.sog.toFixed(1); $('cog').textContent=fix.cog!=null?fmt3(fix.cog):'--'; $('pos').innerHTML=fmtPos2(fix);

    $('srctag').innerHTML=(fix.src==='ship'?'GPS<br>TÀU':'GPS<br>MÁY')+(stale?'<br>⚠ MẤT':sv?'<br>'+sv.n+' VT':''); $('srctag').style.color=stale?'#ff8a80':''; }

setInterval(()=>{ // phát hiện mất GPS tàu → chế độ tự động chuyển sang GPS máy

function shipPos(lat,lon,sog,cog,kind){ const now=Date.now();

  if(kind!=='vdo') ship.nmeaT=now; nmeaCount.gps++;
  const s=fresh(ship.sogT,5000)?ship.sog:0, c=fresh(ship.cogT,5000)?ship.cog:null;
  if(shipFix&&now-shipFix.t<300){                                               // cùng một lần đo (GGA + RMC): chỉ cập nhật tốc độ/hướng đi
    if(sog!=null) shipFix.sog=s; if(c!=null&&s>0.4) shipFix.cog=shipFix.cog==null?c:circMix(shipFix.cog,c,0.5); return; }
  const m={lat,lon,sog:s,cog:(c!=null&&s>0.4)?c:null,acc:fresh(ship.hdopT,10000)&&ship.hdop>0?ship.hdop*4:-1,t:now};
  const r=smoothFix('ship',m,shipFix); if(!r) return; if(r.cog==null&&shipFix) r.cog=shipFix.cog; shipFix=r;

function setHdg(h,kind){ if(!isFinite(h)) return; h=((h%360)+360)%360;
  // làm mượt mũi tàu (la bàn hay rung); quay nhanh > 25° thì theo ngay
  const d=ship.hdg==null||!fresh(ship.hdgT,5000)?999:Math.abs(((h-ship.hdg+540)%360)-180);

function nmeaLL(v,h){ if(!v) return null; const p=v.indexOf('.'), dl=(p<0?v.length:p)-2; if(dl<1) return null;

function nmeaOk(s){ const i=s.indexOf('*'); if(i<0) return true; let c=0; for(let k=1;k<i;k++) c^=s.charCodeAt(k); return parseInt(s.substr(i+1,2),16)===c; }
function parseNmea0183(line){ const f=line.split('*')[0].split(','), t=f[0].slice(3), now=Date.now();

      const mv=num(f[10]); if(mv!=null) ship.magvar=f[11]==='W'?-mv:mv; shipPos(lat,lon,num(f[7]),num(f[8]),'rmc'); break; }
    case 'GGA': { if(!(+f[6]>0)) return; const ns=num(f[7]), hd=num(f[8]); if(ns!=null){ ship.sats=ns; ship.satsT=now; } if(hd!=null){ ship.hdop=hd; ship.hdopT=now; }

      const lat=nmeaLL(f[2],f[3]), lon=nmeaLL(f[4],f[5]); if(lat!=null&&lon!=null) shipPos(lat,lon,null,null,'gga'); break; }
    case 'GSA': { const hd=num(f[16]); if(hd!=null){ ship.hdop=hd; ship.hdopT=now; } break; }
    case 'GLL': { if(f[6]&&f[6]!=='A') return; const lat=nmeaLL(f[1],f[2]), lon=nmeaLL(f[3],f[4]); if(lat!=null&&lon!=null) shipPos(lat,lon,null,null,'gll'); break; }
    case 'VTG': { const c=num(f[1]), s=num(f[5]); if(s!=null){ ship.sog=s; ship.sogT=now; } if(c!=null){ ship.cog=c; ship.cogT=now; } break; }

function navRoute(id,rev){ const r=routes.find(r=>r.id===id); if(!r) return; closePanel(); startNav(r.name,rev?r.pts.slice().reverse():r.pts.slice()); }
function fitPts(id,kind){ const o=kind==='r'?routes.find(r=>r.id===id):tracks.find(t=>t.id===id); if(!o||!o.pts.length) return;
  const ps=o.pts.map(p=>Array.isArray(p)?{lat:p[0],lon:p[1]}:p); fitBounds([Math.min(...ps.map(p=>p.lon)),Math.min(...ps.map(p=>p.lat)),Math.max(...ps.map(p=>p.lon)),Math.max(...ps.map(p=>p.lat))]); closePanel(); }
function fitBounds(b){ follow=false; updFollow(); const x0=lon2x(b[0]),x1=lon2x(b[2]),y0=lat2y(b[3]),y1=lat2y(b[1]);
  S.cx=(x0+x1)/2; S.cy=(y0+y1)/2; const zx=Math.log2(W*0.85/256/Math.max(1e-9,x1-x0)), zy=Math.log2(H*0.7/256/Math.max(1e-9,y1-y0));
  S.zoom=Math.max(2,Math.min(17,Math.min(zx,zy))); redraw(); saveSetSoon(); }

/* ================= Dẫn đường ================= */
let navSog=null, navSogT=0;
function navSpeed(){ // tốc độ trung bình (~2 phút) để thời gian dự kiến không nhảy theo từng con sóng
  if(fix&&fresh(fix.t,10000)){ const now=Date.now(), dt=Math.min(10,(now-(navSogT||now))/1000); navSogT=now;
    navSog=navSog==null?fix.sog:navSog+(fix.sog-navSog)*Math.min(1,dt/120); }
  return navSog!=null&&navSog>0.5?{kn:navSog,plan:false}:{kn:+set.planKn||6,plan:true}; }
function startNav(name,pts){ navSog=fix&&fix.sog>0.5?fix.sog:null; navSogT=Date.now(); nav={name,pts,idx:0,from:fix?{lat:fix.lat,lon:fix.lon}:null}; $('navrow').style.display='flex'; updNav(); posBanner(); redraw();
  const L=(fix?distNm(fix,pts[0]):0)+pathNm(pts), sp=navSpeed();
  toast(`Bắt đầu dẫn đường: ${name} · ${fmtNm(L)} · dự kiến ${fmtDurL(L/sp.kn)}, đến lúc ${fmtClock(L/sp.kn)} (${sp.plan?'theo '+sp.kn+' kn dự kiến':'tốc độ '+sp.kn.toFixed(1)+' kn'})`); }
function stopNav(){ nav=null; $('navrow').style.display='none'; setAlarm('xte',null); posBanner(); redraw(); }
function updNav(){ if(!nav) return; const t=nav.pts[nav.idx];
  $('navname').textContent=(nav.pts.length>1?`${nav.name} (${nav.idx+1}/${nav.pts.length})`:nav.name).toUpperCase().slice(0,26);
  if(!fix){ $('nbrg').textContent='--'; $('ndst').textContent='--'; $('nttg').textContent='--'; $('neta').textContent='--'; $('nxte').textContent='--'; return; }
  if(!nav.from) nav.from={lat:fix.lat,lon:fix.lon};
  let d=distNm(fix,t);
  if(d<0.03){ if(nav.idx<nav.pts.length-1){ nav.from=nav.pts[nav.idx]; nav.idx++; toast('Đã tới điểm '+nav.idx+', chuyển sang điểm kế'); if(NA) NA.beep(); return updNav(); } else { toast('Đã tới đích: '+nav.name); if(NA) NA.beep(); stopNav(); return; } }
  const total=d+pathNm(nav.pts.slice(nav.idx));
  $('nbrg').textContent=fmt3(bearing(fix,t)); $('ndst').textContent=(d<10?d.toFixed(2):d.toFixed(1)); 
  const sp=navSpeed(), hrs=total/sp.kn;
  $('nttg').textContent=fmtDurL(hrs)+(sp.plan?'*':''); $('neta').textContent=fmtClock(hrs)+(sp.plan?'*':'');
  $('nttg').parentNode.title=$('neta').parentNode.title=sp.plan?`* Tàu đang đứng: tính theo tốc độ dự kiến ${sp.kn} kn`:`Theo tốc độ trung bình ${sp.kn.toFixed(1)} kn, còn ${fmtNm(total)}`;
  const legLen=distNm(nav.from,t); const x=legLen>0.01?xteNm(nav.from,t,fix):0;
  $('nxte').textContent=Math.abs(x)<0.005?'0':(Math.abs(x)<10?Math.abs(x).toFixed(2):Math.abs(x).toFixed(1))+(x>0?' P':' T');
  setAlarm('xte', set.alm.xte&&Math.abs(x)>set.alm.xteNm ? `LỆCH ĐƯỜNG ${Math.abs(x).toFixed(2)} nm về bên ${x>0?'PHẢI':'TRÁI'}` : null); }

let bannerHtml='';
function setAlarm(key,msg){ if(msg){ if(alm[key]) alm[key].msg=msg; else alm[key]={msg,ack:false}; } else if(alm[key]) delete alm[key]; else return; renderAlarms(); }
function renderAlarms(){ const keys=Object.keys(alm), b=$('banner'); const want=keys.some(k=>!alm[k].ack);
  if(!keys.length){ b.style.display='none'; bannerHtml=''; }
  else { const h=keys.map(k=>'<div>⚠ '+esc(alm[k].msg)+'</div>').join('')+`<div style="margin-top:8px;display:flex;gap:8px">${want?'<button class="b" onclick="ackAlarms()">🔕 Tắt còi</button>':''}<button class="b" onclick="showAlarms()">Cài đặt</button>${alm.anchor?'<button class="b" onclick="clearAnchor()">Huỷ neo</button>':''}</div>`;
    if(h!==bannerHtml){ b.innerHTML=h; bannerHtml=h; } b.classList.toggle('ack',!want); b.style.display='block'; posBanner(); }
  if(want!==soundOn){ soundOn=want; if(NA) NA.alarm(want); } }
function posBanner(){ $('banner').style.top=($('top').offsetHeight+8)+'px'; }

/* --- CPA / TCPA với tàu AIS (mặt phẳng cục bộ, đơn vị hải lý & hải lý/giờ) --- */
function cpaOf(a){ if(!fix||a.lat==null) return null; const k=Math.cos(fix.lat*D2R);
  const rx=(a.lon-fix.lon)*60*k, ry=(a.lat-fix.lat)*60;
  const os=(fix.sog>0.3&&fix.cog!=null)?fix.sog:0, oc=(fix.cog||0)*D2R;
  const ts=(a.sog!=null&&a.sog<102.3)?a.sog:0, tc=((a.cog!=null&&a.cog<360)?a.cog:(a.hdg!=null&&a.hdg<360?a.hdg:0))*D2R;
  const vx=ts*Math.sin(tc)-os*Math.sin(oc), vy=ts*Math.cos(tc)-os*Math.cos(oc), v2=vx*vx+vy*vy;
  const t=v2<1e-6?0:-(rx*vx+ry*vy)/v2;
  return {cpa:Math.hypot(rx+vx*t,ry+vy*t), tcpa:t*60, range:Math.hypot(rx,ry), rel:Math.sqrt(v2)}; }
function checkCpa(){ const now=Date.now(), seen=new Set();
  const AO=set.aiso; for(const [id,a] of ais){ a.risk=false; if(a.aton||now-a.t>Math.max(0.5,AO.lostMin)*60000) continue; const c=cpaOf(a); if(!c) continue;
    if(AO.rangeOn&&c.range>AO.rangeNm) continue; if(AO.ignAnch&&((a.sog!=null&&a.sog<AO.anchKn)||a.nav===1||a.nav===5)) continue;
    if(set.alm.cpa&&c.rel>0.5&&c.tcpa>=0&&c.tcpa<=set.alm.tcpaMin&&c.cpa<=set.alm.cpaNm){ a.risk=true; seen.add('cpa_'+id);
      setAlarm('cpa_'+id,`NGUY CƠ ĐÂM VA: ${a.name||'MMSI '+id} – CPA ${c.cpa.toFixed(2)} nm sau ${Math.round(c.tcpa)} phút, P.vị ${fmt3(bearing(fix,a))}°`); } }
  for(const k of Object.keys(alm)) if(k.startsWith('cpa_')&&!seen.has(k)) setAlarm(k,null); }
setInterval(()=>{ if(ais.size){ checkCpa(); redraw(); } },3000);

function showAlarms(){ const A=set.alm;
  openPanel('Cài đặt báo động',`<h3 style="margin-top:4px">⚓ Báo động neo</h3>${anchor?`<p>Đang bật, bán kính ${anchor.r} m</p><div class="grid"><button class="b r" onclick="clearAnchor();showAlarms()">Huỷ báo động neo</button></div>`:`<div class="grid"><button class="b p" onclick="setAnchor()">Đặt neo tại vị trí tàu</button></div>`}
  <h3>↔ Lệch đường đi</h3><label class="sw"><input type="checkbox" id="ax" ${A.xte?'checked':''}>Báo khi chạy theo điểm, theo tuyến mà lệch khỏi đường đi</label>
  <div class="cl">Lệch quá (hải lý)</div><input id="axn" type="number" inputmode="decimal" step="any" value="${A.xteNm}">
  <h3>⚠ Nguy cơ đâm va (AIS)</h3><label class="sw"><input type="checkbox" id="ac" ${A.cpa?'checked':''}>Báo khi có tàu AIS nguy hiểm</label>

  <div class="cl">TCPA nhỏ hơn (phút)</div><input id="act" type="number" inputmode="decimal" step="any" value="${A.tcpaMin}">
  <div class="grid"><button class="b" onclick="closePanel()">Đóng</button><button class="b p" onclick="saveAlarms()">💾 Lưu cài đặt</button></div>
  <p class="note">CPA: khoảng cách gần nhất giữa hai tàu nếu cùng giữ nguyên hướng và tốc độ. TCPA: thời gian còn lại tới lúc gần nhất. Cần có GPS và dữ liệu AIS (mục 📡 AIS).</p>`); }

/* ================= Thủy triều (Open-Meteo Marine: sea_level_height_msl) ================= */
let tideData=null;
function tideExtrema(ts,vs){ const out=[];
  for(let i=1;i<vs.length-1;i++){ const a=vs[i-1],b=vs[i],c=vs[i+1]; if(a==null||b==null||c==null) continue;
    const hi=b>a&&b>=c, lo=b<a&&b<=c; if(!hi&&!lo) continue;
    const den=a-2*b+c, off=den!==0?Math.max(-0.5,Math.min(0.5,0.5*(a-c)/den)):0;     // nội suy parabol để lấy giờ chính xác hơn
    out.push({t:ts[i]+off*3600000, h:b-0.25*(a-c)*off, hi}); }
  return out; }
function tideAt(t,d){ d=d||tideData; if(!d) return null; const i=d.ts.findIndex(x=>x>t); if(i<=0) return null;
  const a=d.vs[i-1], b=d.vs[i]; if(a==null||b==null) return null; const k=(t-d.ts[i-1])/(d.ts[i]-d.ts[i-1]); return a+(b-a)*k; }
const hhmm=t=>{ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
async function fetchTide(p){
  const r=await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${p.lat.toFixed(3)}&longitude=${p.lon.toFixed(3)}&hourly=sea_level_height_msl&timezone=auto&timeformat=unixtime&past_days=1&forecast_days=7`).then(r=>{ if(!r.ok) throw new Error('http'); return r.json(); });
  const ts=(r.hourly&&r.hourly.time||[]).map(t=>t*1000), vs=(r.hourly&&r.hourly.sea_level_height_msl)||[];
  if(!vs.some(v=>v!=null)) throw new Error('nodata');
  return {ts,vs,p:{lat:p.lat,lon:p.lon},ex:tideExtrema(ts,vs),ft:Date.now()}; }
async function showTide(p){ p=p||fix||s2ll(W/2,H/2);
  openPanel('Thủy triều','<p>Đang tải dữ liệu thủy triều cho '+fmtPos(p)+'…</p>');
  try{ tideData=await fetchTide(p); renderTide();
  }catch(e){ openPanel('Thủy triều',`<p>${e.message==='nodata'?'Không có dữ liệu thủy triều tại điểm này (có thể nằm trên đất liền hoặc trong sông). Hãy chọn một điểm ngoài biển.':'Không tải được dữ liệu thủy triều. Cần có kết nối mạng.'}</p>`); } }
function renderTide(){ const d=tideData, now=Date.now(), cur=tideAt(now), nx=d.ex.find(e=>e.t>now);
  const trend=nx?(nx.hi?'đang lên ↑':'đang xuống ↓'):'';
  let h=`<p>${fmtPos(d.p)}</p>`;
  if(cur!=null) h+=`<p style="font-size:17px">Mực nước hiện tại: <b>${cur>=0?'+':''}${cur.toFixed(2)} m</b> ${trend}${nx?`<br><span style="font-size:14px">Sắp tới: ${nx.hi?'nước lớn':'nước ròng'} lúc <b>${hhmm(nx.t)}</b> (${nx.h>=0?'+':''}${nx.h.toFixed(2)} m)</span>`:''}</p>`;
  h+=`<canvas id="tidecv" style="width:100%;height:190px;background:#0b2233;border-radius:10px"></canvas>`;
  const days={}; for(const e of d.ex){ if(e.t<now-12*3600000) continue; const dt=new Date(e.t), k=dt.toDateString(); (days[k]=days[k]||{dt,list:[]}).list.push(e); }
  h+='<table class="w"><tr><th>Ngày</th><th>Nước lớn</th><th>Nước ròng</th></tr>';
  for(const k in days){ const {dt,list}=days[k]; const f=hi=>list.filter(e=>e.hi===hi).map(e=>`${hhmm(e.t)} <b>${e.h>=0?'+':''}${e.h.toFixed(2)}</b>`).join('<br>')||'–';
    h+=`<tr><td>${DOW[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</td><td>${f(true)}</td><td>${f(false)}</td></tr>`; }
  h+=`</table><div class="grid"><button class="b" onclick="showTide(fix)">📍 Tại vị trí tàu</button><button class="b" onclick="closePanel()">Chọn điểm khác</button></div>
  <p class="note">Nguồn: Open-Meteo Marine (mô hình MeteoFrance SMOC, ô lưới ~8 km). Độ cao tính so với mực nước biển trung bình, không phải số 0 hải đồ. Gần bờ, cửa sông, đầm phá độ chính xác hạn chế – chỉ để tham khảo, không dùng cho hành hải ven bờ. Để chọn điểm khác: đóng bảng, nhấn giữ trên hải đồ → "Thủy triều tại đây".</p>`;
  openPanel('Thủy triều',h); drawTide(); }
function drawTide(){ const c=$('tidecv'); if(!c||!tideData) return; const d=tideData, dpr=window.devicePixelRatio||1, w=c.clientWidth, hh=c.clientHeight;
  c.width=w*dpr; c.height=hh*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr);
  const now=Date.now(), t0=now-6*3600000, t1=now+66*3600000;           // 3 ngày: 6 giờ trước → 66 giờ sau
  const pts=d.ts.map((t,i)=>[t,d.vs[i]]).filter(([t,v])=>v!=null&&t>=t0-3600000&&t<=t1+3600000); if(pts.length<2) return;
  let mn=Math.min(...pts.map(p=>p[1])), mx=Math.max(...pts.map(p=>p[1])); const pad=(mx-mn)*0.15+0.05; mn-=pad; mx+=pad;
  const L=34,R=6,T=10,B=22, X=t=>L+(t-t0)/(t1-t0)*(w-L-R), Y=v=>T+(mx-v)/(mx-mn)*(hh-T-B);
  g.font='11px system-ui,sans-serif'; g.fillStyle='#8fb3c9'; g.strokeStyle='rgba(143,179,201,.18)'; g.lineWidth=1;
  const step=(mx-mn)>3?1:0.5; for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step){ g.beginPath(); g.moveTo(L,Y(v)); g.lineTo(w-R,Y(v)); g.stroke(); g.fillText((v>0?'+':'')+v.toFixed(1),2,Y(v)+4); }
  for(let t=new Date(t0).setHours(24,0,0,0); t<t1; t+=86400000){ g.beginPath(); g.moveTo(X(t),T); g.lineTo(X(t),hh-B); g.stroke(); const dt=new Date(t); g.fillText(`${DOW[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}`,X(t)+3,hh-6); }
  g.beginPath(); pts.forEach(([t,v],i)=>i?g.lineTo(X(t),Y(v)):g.moveTo(X(t),Y(v))); g.lineTo(X(pts[pts.length-1][0]),hh-B); g.lineTo(X(pts[0][0]),hh-B); g.closePath();
  g.fillStyle='rgba(30,136,229,.28)'; g.save(); g.beginPath(); g.rect(L,T,w-L-R,hh-T-B); g.clip();
  g.beginPath(); pts.forEach(([t,v],i)=>i?g.lineTo(X(t),Y(v)):g.moveTo(X(t),Y(v))); g.lineTo(X(pts[pts.length-1][0]),hh-B); g.lineTo(X(pts[0][0]),hh-B); g.closePath(); g.fill();
  g.beginPath(); pts.forEach(([t,v],i)=>i?g.lineTo(X(t),Y(v)):g.moveTo(X(t),Y(v))); g.strokeStyle='#4fc3f7'; g.lineWidth=2; g.stroke();
  for(const e of d.ex){ if(e.t<t0||e.t>t1) continue; g.fillStyle=e.hi?'#ffd54a':'#80cbc4'; g.beginPath(); g.arc(X(e.t),Y(e.h),3,0,7); g.fill();
    g.fillText(hhmm(e.t),X(e.t)-14,Y(e.h)+(e.hi?-6:14)); }
  g.restore();
  g.strokeStyle='#ff5252'; g.lineWidth=1.5; g.beginPath(); g.moveTo(X(now),T); g.lineTo(X(now),hh-B); g.stroke();
  const cur=tideAt(now); if(cur!=null){ g.fillStyle='#ff5252'; g.beginPath(); g.arc(X(now),Y(cur),4,0,7); g.fill(); } }

/* --- Thủy triều tự động trên màn hình hải đồ: tự tải khi có mạng, lưu lại để dùng khi mất mạng --- */

async function autoTide(force){ if(set.tideBox===false) return;

  const far=!tideAuto||distNm(tideAuto.p,p)>10, old=!tideAuto||now-tideAuto.ft>3*3600000;
  if(!force&&!far&&!old) return;
  if(!force&&now-tideTry<10*60000) return;                 // lỗi/không mạng: 10 phút sau mới thử lại
  if(navigator.onLine===false) return;
  tideTry=now;
  try{ const d=await fetchTide(p); tideAuto=d; tideTry=0; store.save('tideAuto',{ts:d.ts,vs:d.vs,p:d.p,ft:d.ft}); }
  catch(e){ if(e.message==='nodata'&&far){ tideAuto={none:true,p:{lat:p.lat,lon:p.lon},ft:now}; } }
  updTideBox(); }

  const now=Date.now(), cur=tideAt(now,tideAuto), nx=tideAuto.ex.find(e=>e.t>now);
  if(cur==null){ b.style.display='none'; return; }
  const p=fix||s2ll(W/2,H/2), far=distNm(tideAuto.p,p)>30;
  b.innerHTML=`🌊 <b>${cur>=0?'+':''}${cur.toFixed(2)} m</b> ${nx?(nx.hi?'↑':'↓'):''}`+(nx?` <span style="opacity:.85">· ${nx.hi?'Lớn':'Ròng'} ${hhmm(nx.t)} ${nx.h>=0?'+':''}${nx.h.toFixed(1)}</span>`:'')+(far?' <span style="color:#ffb74d">(xa)</span>':'');

const aisFrag={};

const sb=(b,s,n)=>{ let v=ub(b,s,n); if(b[s]==='1') v-=Math.pow(2,n); return v; };

  if(tot>1){ if(num===1) aisFrag[key]={n:1,p:payload}; else { const f=aisFrag[key]; if(!f||f.n!==num-1){ delete aisFrag[key]; return null; } f.n=num; f.p+=payload; } if(num<tot) return null; payload=aisFrag[key].p; delete aisFrag[key]; }

  const pos=(lonS,sogS,cogS,hdgS)=>{ const lon=sb(b,lonS,28)/600000, lat=sb(b,lonS+28,27)/600000; if(Math.abs(lon)<=180&&Math.abs(lat)<=90){ r.lon=lon; r.lat=lat; }
    const sog=ub(b,sogS,10); if(sog<1023) r.sog=sog/10; const cog=ub(b,cogS,12); if(cog<3600) r.cog=cog/10; const hdg=ub(b,hdgS,9); if(hdg<360) r.hdg=hdg; };
  const dims=s=>{ const A=ub(b,s,9),B=ub(b,s+9,9),C=ub(b,s+18,6),D=ub(b,s+24,6); if(A+B>0) r.len=A+B; if(C+D>0) r.beam=C+D; };

    r.nav=ub(b,38,4); const ro=sb(b,42,8); if(ro!==-128){ r.rot=Math.abs(ro)===127?(ro>0?720:-720):Math.sign(ro)*Math.pow(ro/4.733,2); } }

  else if(type===5){ if(b.length<232) return null; r.cls='A'; const imo=ub(b,40,30); if(imo) r.imo=imo; r.callsign=txt(b,70,42); r.name=txt(b,112,120);

const nmeaCs=s=>{ let c=0; for(let i=0;i<s.length;i++) c^=s.charCodeAt(i); return '$'+s+'*'+c.toString(16).toUpperCase().padStart(2,'0')+'\r\n'; };

    txt+=nmeaCs(`GPRMC,${hms},A,${nmeaFmtLL(fix.lat,1)},${nmeaFmtLL(fix.lon,0)},${(fix.sog||0).toFixed(1)},${fix.cog!=null?fix.cog.toFixed(1):''},${dmy},,,A`);
    if(nav){ const t=nav.pts[nav.idx], from=nav.from||fix, x=distNm(from,t)>0.01?xteNm(from,t,fix):0, ax=Math.abs(x).toFixed(3), dir=x>0?'L':'R';   // lệch phải → lái sang trái
      const rng=distNm(fix,t), brg=bearing(fix,t), bo=bearing(from,t), vmg=(fix.sog||0)*Math.cos(((fix.cog||brg)-brg)*D2R), arr=rng<0.05?'A':'V';
      const fromId=nav.idx>0?'WP'+nav.idx:'ORIG', toId='WP'+(nav.idx+1);
      txt+=nmeaCs(`GPRMB,A,${ax},${dir},${fromId},${toId},${nmeaFmtLL(t.lat,1)},${nmeaFmtLL(t.lon,0)},${Math.min(rng,999.9).toFixed(1)},${brg.toFixed(1)},${Math.max(-99.9,Math.min(99.9,vmg)).toFixed(1)},${arr},A`);
      txt+=nmeaCs(`GPAPB,A,A,${ax},${dir},N,${arr},V,${bo.toFixed(1)},T,${toId},${brg.toFixed(1)},T,${brg.toFixed(1)},T,A`);

function buildGpx(){ const x=s=>esc(s); let o='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="HaiDoVN" xmlns="http://www.topografix.com/GPX/1/1">\n';
  for(const w of wpts) o+=`<wpt lat="${w.lat}" lon="${w.lon}"><name>${x(w.name)}</name></wpt>\n`;
  for(const r of routes) o+=`<rte><name>${x(r.name)}</name>`+r.pts.map(p=>`<rtept lat="${p.lat}" lon="${p.lon}"/>`).join('')+'</rte>\n';
  for(const t of tracks) o+=`<trk><name>${x(t.name)}</name><trkseg>`+t.pts.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}">${p[2]?'<time>'+new Date(p[2]).toISOString()+'</time>':''}</trkpt>`).join('')+'</trkseg></trk>\n';
  return o+'</gpx>\n'; }
function parseGpx(text){ const d=new DOMParser().parseFromString(text,'application/xml'); if(d.getElementsByTagName('parsererror').length) throw new Error('xml');
  const nm=(e,def)=>{ for(const c of e.children) if(c.localName==='name') return c.textContent.trim()||def; return def; };
  const ll=e=>({lat:parseFloat(e.getAttribute('lat')),lon:parseFloat(e.getAttribute('lon'))}); const ok=p=>isFinite(p.lat)&&isFinite(p.lon);
  const out={w:[],r:[],t:[]}; const by=n=>[...d.getElementsByTagNameNS('*',n)];
  by('wpt').forEach((e,i)=>{ const p=ll(e); if(ok(p)) out.w.push({id:uid(),name:nm(e,'Điểm '+(i+1)),lat:p.lat,lon:p.lon}); });
  by('rte').forEach((e,i)=>{ const pts=[...e.getElementsByTagNameNS('*','rtept')].map(ll).filter(ok); if(pts.length>1) out.r.push({id:uid(),name:nm(e,'Tuyến '+(i+1)),pts}); });
  by('trk').forEach((e,i)=>{ const pts=[...e.getElementsByTagNameNS('*','trkpt')].map(q=>{ const p=ll(q); const tm=q.getElementsByTagNameNS('*','time')[0]; return [p.lat,p.lon,tm?Date.parse(tm.textContent)||0:0]; }).filter(p=>isFinite(p[0])&&isFinite(p[1])); if(pts.length>1) out.t.push({id:uid(),name:nm(e,'Vết '+(i+1)),pts}); });
  return out; }
window.onGpxImported=function(text){ try{ const g=parseGpx(text); wpts.push(...g.w); routes.push(...g.r); tracks.push(...g.t);
    store.save('wpts',wpts); store.save('routes',routes); store.save('tracks',tracks); redraw(); toast(`Đã nhập ${g.w.length} điểm, ${g.r.length} tuyến, ${g.t.length} vết`);
  }catch(e){ toast('Tệp GPX không đọc được'); } };

  return (PC?'W':'A')+b32e(h).slice(0,11); }
let licKey=null;
async function licVerify(code,id){ const c=cleanCode(code); if(c.length<110||!LIC_PUB) return null; const b=b32d(c); if(!b||b.length<70||b[0]!==1) return null;
  try{ licKey=licKey||await crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const p=b.slice(0,6), msg=new Uint8Array([...p,...new TextEncoder().encode('HDVN|'+id)]);
    if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},licKey,b.slice(6,70),msg)) return null;
    return {type:p[1]===2?'paid':'trial', exp:LIC_EPOCH+(((p[2]<<24)|(p[3]<<16)|(p[4]<<8)|p[5])>>>0)*60000, code:c}; }catch(e){ return null; } }
async function licApply(code,src){ const v=await licVerify(code,licSt.id); if(!v) return false;
  const cur=lic.code?await licVerify(lic.code,licSt.id):null;
  if(!cur||v.exp>cur.exp||(v.type==='paid'&&cur.type!=='paid'&&v.exp>=licNow())){ lic.code=v.code; store.save('lic',lic); }
  return true; }
async function licEval(){ const v=lic.code?await licVerify(lic.code,licSt.id):null, now=licNow();
  licSt.type=v?v.type:null; licSt.exp=v?v.exp:0; licSt.ok=!!v&&v.exp>now; licSt.ready=true;
  if(licSt.ok) $('lock').style.display='none'; else showLock(); }
async function licPost(path,body){ const r=await fetch(LIC_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'Máy chủ trả lời lỗi'})); if(j.now){ lic.seen=j.now; store.save('lic',lic); } return j; }   // j.now: giờ chuẩn từ máy chủ
let licSyncT=0;
async function licSync(manual){ if(!licSt.id||!LIC_URL.startsWith('http')) return; licSyncT=Date.now();
  try{ const had=licSt.ok, j=await licPost('/trial',{id:licSt.id,plat:PC?'windows':'android',ver:APP_VER});
    if(j.error){ if(manual) lockMsg(j.error); return; }
    const was=licSt.type; await licApply(j.code); await licEval();
    if(!had&&licSt.ok&&j.type==='trial'&&!was) toast('Bắt đầu dùng thử 7 ngày – còn '+fmtLeft(licSt.exp-licNow()));
    if(manual&&!licSt.ok) lockMsg(j.type==='trial'?'Máy này đã hết thời gian dùng thử. Vui lòng nhập mã bản quyền.':'');
  }catch(e){ if(manual) lockMsg('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); } }
async function licEnter(input){ const c=cleanCode(input); const say=m=>{ lockMsg(m); const e=$('licmsg2'); if(e) e.textContent=m; };
  if(!c) return say('Hãy nhập mã.');
  if(c.length===12&&c.startsWith('HD')){ say('Đang kích hoạt…');
    try{ const j=await licPost('/redeem',{id:licSt.id,key:c}); if(j.error) return say(j.error);
      if(!await licApply(j.code)) return say('Mã nhận về không hợp lệ.'); await licEval(); closePanel();
      toast('Đã kích hoạt bản quyền – hạn dùng đến '+fmtDate(licSt.exp)); }catch(e){ say('Cần kết nối mạng để kích hoạt mã HD-… (hoặc dùng mã dài).'); } return; }
  if(c.length>=110){ const v=await licVerify(c,licSt.id); if(!v) return say('Mã không đúng hoặc không phải của máy này.');
    if(v.exp<=licNow()) return say('Mã này đã hết hạn.'); await licApply(c); await licEval(); closePanel(); toast('Đã kích hoạt – hạn dùng đến '+fmtDate(licSt.exp)); return; }
  say('Mã không đúng định dạng (dạng HD-XXXX-XXXX-XX).'); }
function lockMsg(m){ const e=$('lmsg'); if(e) e.textContent=m||''; }
function contactBtns(){ return `<div class="grid" style="margin-top:10px"><button class="b" onclick="openUrl('tel:0586568569')">📞 Gọi Mr Công</button><button class="b" onclick="openUrl('https://zalo.me/0586568569')">💬 Zalo 0586 568 569</button></div>`; }
function copyId(){ const t='ID máy Hải đồ VN: '+fmtId(licSt.id); try{ navigator.clipboard.writeText(t).then(()=>toast('Đã chép ID máy'),()=>toast(t)); }catch(e){ toast(t); } }
function showLock(){ const L=$('lock'); if(L.style.display==='flex'&&$('lcode')) return;
  closePanel(); hidePopup&&hidePopup();
  const why=licSt.type==='trial'?'Đã hết thời gian dùng thử 7 ngày.':licSt.type==='paid'?'Bản quyền đã hết hạn ngày '+fmtDate(licSt.exp)+'.':'Phần mềm chưa được kích hoạt.';
  L.innerHTML=`<div class="card"><h2>🔑 Hải đồ VN – cần mã bản quyền</h2><p>${why} Hải đồ tạm khoá cho tới khi nhập mã.</p>
    <p style="margin:10px 0 2px">ID máy của bạn (gửi cho Mr Công để mua mã):</p><div class="id">${fmtId(licSt.id)}</div>
    <div class="grid"><button class="b" onclick="copyId()">📋 Chép ID máy</button>${licSt.type?'':'<button class="b" onclick="licSync(true)">↻ Dùng thử 7 ngày</button>'}</div>
    <p style="margin:14px 0 6px">Nhập mã kích hoạt:</p><input id="lcode" placeholder="HD-XXXX-XXXX-XX" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')licEnter(this.value)">
    <div class="msg" id="lmsg">${licSt.type?'':'Lần đầu sử dụng cần có mạng để nhận 7 ngày dùng thử.'}</div>
    <div class="grid"><button class="b p" onclick="licEnter($('lcode').value)">✔ Kích hoạt</button></div>${contactBtns()}
    <p class="note" style="margin-top:12px">Mã bản quyền dùng 365 ngày, gắn với máy này. Sau khi kích hoạt dùng được cả khi không có mạng.</p></div>`;
  L.style.display='flex'; }
function showLicense(){ const left=licSt.exp-licNow();
  openPanel('Bản quyền',`<div class="info"><p style="font-size:18px">${licSt.ok?(licSt.type==='paid'?'✅ Đã kích hoạt bản quyền':'⏳ Đang dùng thử'):'⛔ Chưa có bản quyền'}</p>
   ${licSt.ok?`<p>Còn lại: <b style="font-size:22px;color:#ffd54a">${fmtLeft(left)}</b><br>Hết hạn lúc: <b>${fmtDate(licSt.exp)}</b></p>`:''}
   <p>ID máy: <b style="font-family:ui-monospace,monospace;font-size:18px">${fmtId(licSt.id)}</b> <button class="b" style="padding:4px 10px" onclick="copyId()">Chép</button></p>
   <p style="margin-bottom:6px">${licSt.type==='paid'?'Gia hạn – nhập mã mới (thời gian được cộng nối tiếp):':'Nhập mã kích hoạt:'}</p>
   <input id="lcode2" placeholder="HD-XXXX-XXXX-XX" style="width:100%;box-sizing:border-box;text-transform:uppercase;font-size:17px;padding:12px;border-radius:10px;border:1px solid #2f5672;background:#0a1a27;color:#fff" autocomplete="off" onkeydown="if(event.key==='Enter')licEnter(this.value)">
   <div id="licmsg2" style="color:#ffd54a;min-height:20px;margin:6px 0"></div>
   <div class="grid"><button class="b p" onclick="licEnter($('lcode2').value)">✔ Kích hoạt</button><button class="b" onclick="licSync(true).then(()=>showLicense())">↻ Đồng bộ</button></div>${contactBtns()}</div>`); }
async function licInit(){ try{ licSt.id=await machineId(); }catch(e){ licSt.id='A00000000000'; }
  await licEval();
  if(!licSt.ok||Date.now()-(lic.syncT||0)>6*3600000) licSync(false).then(()=>{ lic.syncT=Date.now(); store.save('lic',lic); });
  licWarn(); }
let licWarnT=0;
function licWarn(){ if(!licSt.ok) return; const left=licSt.exp-licNow();
  if(left<7*86400000&&Date.now()-licWarnT>3*3600000){ licWarnT=Date.now();
    toast((licSt.type==='trial'?'Dùng thử':'Bản quyền')+' còn '+fmtLeft(left)+' – liên hệ Mr Công 0586 568 569 để '+(licSt.type==='trial'?'mua mã':'gia hạn')); } }
setInterval(()=>{ if(!licSt.ready) return; if(licSt.ok&&licSt.exp<=licNow()) licEval(); else licWarn();
  if(Date.now()>(lic.seen||0)){ lic.seen=Date.now(); if(Date.now()-(lic.savedT||0)>600000){ lic.savedT=Date.now(); store.save('lic',lic); } }
  if(Date.now()-licSyncT>6*3600000) licSync(false); },30000);
window.addEventListener('online',()=>{ if(!licSt.ok) licSync(false); });
licInit();

/* ================= Khởi động ================= */
applyNight(); updFollow(); refreshCharts(); resize(); updTideBox(); setTimeout(()=>autoTide(),1500);

/* ================= Thông báo từ nhà phát triển (📢) =================
   Đọc tệp thongbao.txt trên kho GitHub; mỗi dòng bắt đầu bằng "@thongbao:" là một thông báo.
   Cứ 3 phút hiện một thông báo (lần lượt nếu có nhiều dòng), tự ẩn sau 20 giây; lưu lại để dùng khi mất mạng. */
const NOTICE_URL='https://raw.githubusercontent.com/BiG-seaman/haidotiengviet/main/thongbao.txt';
let notices=(store.load('notices')||{}).lines||[], noticeIdx=0, noticeT=0, noticeFetchT=0;
async function fetchNotices(){ if(navigator.onLine===false) return;
  try{ const r=await fetch(NOTICE_URL+'?t='+Math.floor(Date.now()/60000),{cache:'no-store'}); if(!r.ok) return;
    const lines=(await r.text()).split(/\r?\n/).map(l=>l.trim()).filter(l=>/^@thongbao\s*:/i.test(l)).map(l=>l.replace(/^@thongbao\s*:\s*/i,'')).filter(Boolean).slice(0,20);
    notices=lines; noticeFetchT=Date.now(); store.save('notices',{lines,t:noticeFetchT}); if(!lines.length) hideNotice(); }catch(e){} }
function showNotice(){ if(!notices.length) return;
  if(licSt.ok&&licSt.type==='paid'){ hideNotice(); return; }                  // máy đã mua bản quyền: không hiện quảng cáo
  if(Object.keys(alm).length||$('modal').style.display==='flex') return;      // không che báo động / hộp thoại
  const t=notices[noticeIdx%notices.length]; noticeIdx++;
  $('ntext').textContent='📢 '+t; const n=$('notice');
  n.style.display='none'; void n.offsetWidth; n.style.display='block';
  clearTimeout(noticeT); noticeT=setTimeout(hideNotice,20000); }
function hideNotice(e){ if(e) e.stopPropagation(); clearTimeout(noticeT); $('notice').style.display='none'; }
function noticeTap(e){ hideNotice(e); showInfo(); }
setTimeout(async()=>{ await fetchNotices(); showNotice(); },8000);
setInterval(()=>{ if(Date.now()-noticeFetchT>15*60000) fetchNotices(); showNotice(); },3*60000);
window.addEventListener('online',fetchNotices);
if(anchor) redraw();
if(!NA && navigator.geolocation) navigator.geolocation.watchPosition(p=>window.onGps(p.coords.latitude,p.coords.longitude,p.coords.speed==null?-1:p.coords.speed,p.coords.heading==null?-1:p.coords.heading,p.coords.accuracy,p.timestamp),()=>{}, {enableHighAccuracy:true});
if(NA) NA.ready();
setTimeout(connsBoot,1500);   // bật lại các kết nối thiết bị đã lưu
</script>
