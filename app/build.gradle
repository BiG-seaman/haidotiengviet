plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.haido.mo'
    compileSdk 37

    defaultConfig {
        applicationId 'vn.haido.mo'
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName '1.24'
    }

    // Dùng một khoá ký cố định để các bản build sau cài đè được lên bản trước (không mất dữ liệu)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // không nén tệp hải đồ trong APK để chép ra nhanh
    androidResources { noCompress 'mbtiles' }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    // cổng COM qua cáp USB OTG (CP210x, CH340, PL2303, FTDI, CDC-ACM…)
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
}
