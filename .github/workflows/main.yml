name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lay hai do nen mac dinh tu Releases (neu co)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/basemap
          gh release download basemap --repo "${{ github.repository }}" --pattern "*.mbtiles" --dir /tmp/basemap || echo "Chua co hai do nen mac dinh trong Releases (tag basemap)"
          f=$(ls /tmp/basemap/*.mbtiles 2>/dev/null | head -1)
          if [ -n "$f" ]; then cp "$f" app/src/main/assets/default.mbtiles; ls -la app/src/main/assets; fi
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HaiDoMo-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
